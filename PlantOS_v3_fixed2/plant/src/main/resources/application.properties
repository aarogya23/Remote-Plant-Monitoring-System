spring.application.name=plant

# --- SERVER SETTINGS ---
server.port=8080

# --- BLUETOOTH CONFIGURATION ---
# Change this to match the COM port assigned to the ESP32 in Windows Bluetooth Settings
bluetooth.port.name=COM4

# --- DATABASE CONNECTION (H2 FILE-BASED DATABASE) ---
# spring.datasource.url=jdbc:h2:./plantosdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MYSQL
# spring.datasource.driverClassName=org.h2.Driver
# spring.h2.console.enabled=true

# --- DATABASE CONNECTION (MYSQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/plantdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HIBERNATE / JPA CONFIG ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
